<style>
:root{--bg:#0b0e14;--s1:#131824;--s2:#1a2030;--s3:#232a3c;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--tx:#eef2f8;--dim:#8b96aa;--g:#4ade80;--b:#60a5fa;--r:#f87171;--o:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
.app{display:flex;min-height:100vh}
.nav{width:230px;flex:none;background:var(--s1);border-inline-end:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:900;font-size:21px;direction:ltr;text-align:center;margin:4px 0 2px}.brand span{color:var(--g)}
.role{text-align:center;font-size:11.5px;color:var(--dim);margin-bottom:16px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;color:#cbd5e1;text-decoration:none;cursor:pointer;font-size:14.5px}
.nav a.on{background:rgba(74,222,128,.12);color:var(--g);font-weight:700}
.nav a .c{margin-inline-start:auto;font-size:11px;background:var(--s3);border-radius:999px;padding:1px 8px;color:var(--dim)}
.nav .me{margin-top:auto;padding:10px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.lnk{background:none;border:0;color:var(--b);font:inherit;font-size:12.5px;cursor:pointer;padding:0;text-align:start}
main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
h1{margin:0;font-size:24px}
.top .sp{flex:1}
.sub{color:var(--dim);font-size:13.5px;margin:4px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px}
.kpi small{color:var(--dim);font-size:12.5px}.kpi b{display:block;font-size:28px;margin-top:4px}
.kpi.w b{color:var(--o)}.kpi.g b{color:var(--g)}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:6px 14px 10px;margin-bottom:16px;overflow-x:auto}
.box h3{margin:10px 0 6px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);font-weight:600;text-align:start;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:12.5px;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:rgba(255,255,255,.03)}
.empty{color:var(--dim);padding:14px 8px}
small.d{color:var(--dim);font-size:12px}
.mono{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.g{background:rgba(74,222,128,.14);color:var(--g)}.pill.o{background:rgba(251,146,60,.14);color:var(--o)}.pill.r{background:rgba(248,113,113,.14);color:var(--r)}.pill.d{background:var(--s3);color:var(--dim)}.pill.b{background:rgba(96,165,250,.14);color:var(--b)}
.btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.g{background:#22c55e;color:#06210f}.btn.o{background:none;border:1px solid var(--bd2);color:var(--tx)}.btn.r{background:rgba(248,113,113,.14);color:var(--r);border:1px solid rgba(248,113,113,.35)}
.search{width:320px;max-width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;padding:9px 12px;color:var(--tx);font:inherit;font-size:13.5px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar .sp{flex:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:460px;max-width:100%;background:var(--s1);border-inline-end:1px solid var(--bd2);box-shadow:0 0 40px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s,visibility .25s;padding:20px;overflow:auto;z-index:5}
[dir=ltr] .drawer{transform:translateX(-105%)}
.drawer:not(.open){visibility:hidden}
.drawer.open{transform:none!important}
.drawer h2{margin:0 40px 4px 0;font-size:19px}
[dir=rtl] .drawer h2{margin:0 0 4px 40px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.kv span{color:var(--dim)}.kv b{text-align:end;word-break:break-word}
.kv.ck{cursor:pointer}
.sec{font-size:12px;color:var(--dim);margin:18px 0 6px;font-weight:600}
.x{position:absolute;top:14px;inset-inline-end:14px;background:var(--s3);border:0;color:var(--tx);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:20px;width:460px;max-width:100%;max-height:100%;overflow:auto}
.mbox h3{margin:0 0 6px}.mbox p{color:var(--dim);font-size:13.5px;line-height:1.7;margin:0 0 10px}
.lbl{font-size:12.5px;color:var(--dim);margin:10px 0 5px}
.in{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;color:var(--tx);font:inherit;font-size:14px}
.in.mono{text-align:left}
.cb{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#cbd5e1;margin:8px 0;line-height:1.6}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ok{background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.35);color:#86efac;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.warn{background:rgba(251,146,60,.10);border:1px solid rgba(251,146,60,.35);color:#fdba74;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.page{display:none}.page.on{display:block}
.tabs{display:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lg{width:100%;max-width:380px;text-align:center;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:28px 22px}
.lg .logo{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f2937;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px}
.gbtn svg{width:20px;height:20px}
.mask{cursor:pointer;border-bottom:1px dashed var(--bd2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--bd2);border-radius:12px;padding:10px 16px;font-size:13.5px;z-index:20;display:none}
.toast.on{display:block}
@media(max-width:900px){
  .nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}main{padding:14px 16px 90px}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:var(--s1);border-top:1px solid var(--bd);z-index:4}
  .tabs a{flex:1;text-align:center;padding:9px 4px 11px;font-size:11.5px;color:var(--dim);cursor:pointer}
  .tabs a.on{color:var(--g);font-weight:700}
  .tabs a i{display:block;font-style:normal;font-size:18px}
  .search{width:100%}
  .hm{display:none}
}
</style>

 sim:['رقم شريحة الجهاز','N° SIM du boîtier'], place:['المكان','Lieu'], actions:['إجراءات','Actions'],
 free_note:['الجهاز حرّ: ينتظر أن يضغط زبون CONFIG.','Boîtier libre : il attend qu\'un client appuie sur CONFIG.'],
 save_note:['حفظ الملاحظة','Enregistrer la note'], is_admin:['مدير','Admin'],
 attn_nokey:['جهاز بدون مفتاح: لا يمكن ربطه','Boîtier sans clé : impossible à relier'],
 attn_noplace:['زبون بلا مكان منذ أكثر من 7 أيام','Client sans lieu depuis plus de 7 jours'],
 a_claim:['ربط جهاز','Liaison'], a_unlink:['فك الربط (المالك)','Déliaison (propriétaire)'], a_admin_unlink:['فك الربط (المدير)','Déliaison (admin)'],
 a_register:['إضافة جهاز','Ajout boîtier'], a_invite:['دعوة مسؤول','Invitation'], a_invite_accept:['قبول دعوة','Invitation acceptée'],
 a_member_remove:['إزالة مسؤول','Responsable retiré'], a_owner_transfer:['نقل الملكية','Transfert de propriété'], a_account_delete:['حذف حساب','Compte supprimé'],
 show:['اضغط للإظهار','toucher pour afficher'],
 note_key:['الملاحظة تشبه مفتاحًا: لا تضع المفتاح هنا (الملاحظة ليست سرية). ضعه في خانة المفتاح فقط.','La note ressemble à une clé : ne mettez pas la clé ici (la note n\'est pas secrète). Mettez-la seulement dans le champ Clé.']
};
var LANG='ar'; try{ LANG=localStorage.getItem('tayoga_admin_lang')||'ar'; }catch(e){}
function t(k){ var v=T[k]; return v?(LANG==='fr'?v[1]:v[0]):k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function q(id){ return document.getElementById(id); }
function applyLang(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='fr'?'ltr':'rtl';
  document.querySelectorAll('[data-t]').forEach(function(e){ e.innerHTML=t(e.getAttribute('data-t')); });
  q('s-cl').placeholder=t('search_cl'); q('s-dv').placeholder=t('search_dv'); q('u-r').placeholder='';
}
function toggleLang(){ LANG=LANG==='fr'?'ar':'fr'; try{ localStorage.setItem('tayoga_admin_lang',LANG); }catch(e){} applyLang(); if(DB)renderAll(); }
function toast(m){ var e=q('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ e.classList.remove('on'); },2600); }
function fmtD(s,withTime){
  if(!s)return '—'; var d=new Date(s); if(isNaN(d))return '—';
  function z(n){ return (n<10?'0':'')+n; }
  return '<bdi dir="ltr">'+z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+(withTime?' '+z(d.getHours())+':'+z(d.getMinutes()):'')+'</bdi>';
}
function maskPh(p){ if(!p)return '—'; p=String(p); return p.slice(0,5)+'•• ••• •'+p.slice(-2); }
function phHtml(p){ if(!p)return '—'; return '<span class="mono mask" title="'+esc(t('show'))+'" onclick="event.stopPropagation();this.textContent=this.getAttribute(\'data-v\')" data-v="'+esc(p)+'">'+esc(maskPh(p))+'</span>'; }

var sb=null, DB=null, ME=null;
function errText(e){
  var m=(e&&(e.message||e.msg))||'';
  if(m==='denied')return t('not_admin');
  if(/fetch|network/i.test(m))return t('err_net');
  if(m==='device')return t('bad_id'); if(m==='key')return t('bad_key');
  return m||t('err_net');
}
function showLogin(msg,signedIn){
  q('app').style.display='none'; q('login').style.display='flex';
  q('lg-msg').innerHTML=msg?'<div class="err">'+msg+'</div>':'';
  q('lg-out').style.display=signedIn?'':'none'; q('lg-g').style.display=signedIn?'none':'';
}
function signIn(){
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}})
    .then(function(r){ if(r.error)showLogin(esc(errText(r.error))); });
}
function signOut(){ sb.auth.signOut().then(function(){ DB=null; ME=null; showLogin(''); }); }

function load(){
  return sb.rpc('admin_overview').then(function(r){
    if(r.error){
      if(r.error.message==='denied'){ showLogin(esc(t('not_admin'))+'<br><span class="mono">'+esc(ME&&ME.email||'')+'</span>',true); return; }
      toast(errText(r.error)); return;
    }
    DB=r.data; index();
    q('login').style.display='none'; q('app').style.display='flex';
    q('me-mail').textContent=ME&&ME.email||'';
    renderAll();
  },function(e){ toast(errText(e)); });
}
var U={},P={},M={},DV={};
function index(){
  U={}; P={}; M={}; DV={};
  DB.users.forEach(function(u){ U[u.id]=u; u.places=[]; u.devs=[]; });
  DB.places.forEach(function(p){ P[p.id]=p; p.mem=[]; p.devs=[]; });
  DB.members.forEach(function(m){ var p=P[m.place]; if(p)p.mem.push(m); var u=U[m.user]; if(u&&p)u.places.push({p:p,role:m.role}); });
  DB.devices.forEach(function(d){ DV[d.id]=d; var p=d.place&&P[d.place]; if(p){ p.devs.push(d); p.mem.forEach(function(m){ var u=U[m.user]; if(u)u.devs.push(d); }); } });
}
function uName(u){ return u?(u.name||u.email||'—'):'—'; }
function ownerOf(p){ var o=p&&p.mem.filter(function(m){ return m.role==='owner'; })[0]; return o&&U[o.user]; }
function devState(d){
  if(!d.key)return '<span class="pill r">'+t('st_nokey')+'</span>';
  return d.place?'<span class="pill g">● '+t('st_linked')+'</span>':'<span class="pill o">'+t('st_free')+'</span>';
}
function actLabel(a){ return T['a_'+a]?t('a_'+a):a; }
function actDetail(a){
  var u=a.user&&U[a.user], p=a.place&&P[a.place], x=a.detail||{}, s=[];
  if(u)s.push(esc(uName(u)));
  if(p)s.push(esc(p.name));
  if(x.reason)s.push('«'+esc(x.reason)+'»');
  if(x.was&&U[x.was])s.push('← '+esc(uName(U[x.was])));
  if(x.to&&U[x.to])s.push('→ '+esc(uName(U[x.to])));
  if(x.user&&U[x.user])s.push(esc(uName(U[x.user])));
  return s.join(' · ')||'—';
}
function logRow(a){ return '<tr'+(a.device?' class="ck" onclick="openDev(\''+esc(a.device)+'\')"':'')+'><td class="mono">'+fmtD(a.at,true)+'</td><td>'+esc(actLabel(a.action))+'</td><td class="mono">'+esc(a.device||'—')+'</td><td>'+actDetail(a)+'</td></tr>'; }

function renderHome(){
  var linked=DB.devices.filter(function(d){ return d.place; }).length;
  q('k1').textContent=DB.users.length; q('k2').textContent=DB.places.length;
  q('k3').textContent=linked+' / '+DB.devices.length; q('k4').textContent=DB.devices.filter(function(d){ return !d.place&&d.key; }).length;
  q('home-sub').textContent=new Date().toLocaleDateString(LANG==='fr'?'fr-FR':'ar-MA',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  var rows=[];
  DB.devices.filter(function(d){ return !d.key; }).forEach(function(d){ rows.push('<tr class="ck" onclick="openDev(\''+esc(d.id)+'\')"><td class="mono">'+esc(d.id)+'</td><td>'+t('attn_nokey')+'</td></tr>'); });
  var wk=Date.now()-7*864e5;
  DB.users.filter(function(u){ return !u.places.length&&!u.admin&&new Date(u.created).getTime()<wk; }).forEach(function(u){ rows.push('<tr class="ck" onclick="openCl(\''+esc(u.id)+'\')"><td>'+esc(uName(u))+'</td><td>'+t('attn_noplace')+'</td></tr>'); });
  q('t-attn').innerHTML=rows.join('')||'<tr><td class="empty">'+t('nothing')+'</td></tr>';
  q('t-new').innerHTML=DB.audit.slice(0,8).map(logRow).join('')||'<tr><td colspan="4" class="empty">'+t('none')+'</td></tr>';
}
function renderClients(){
  var f=(q('s-cl').value||'').trim().toUpperCase();
  var L=DB.users.filter(function(u){
    if(!f)return true;
    return (uName(u)+' '+(u.email||'')+' '+u.places.map(function(x){ return x.p.name; }).join(' ')+' '+u.devs.map(function(d){ return d.id; }).join(' ')).toUpperCase().indexOf(f)>=0;
  });
  q('t-clients').innerHTML=L.map(function(u){
    return '<tr class="ck" onclick="openCl(\''+esc(u.id)+'\')"><td><b>'+esc(uName(u))+'</b>'+(u.admin?' <span class="pill b">'+t('is_admin')+'</span>':'')+'<br><small class="d mono">'+esc(u.email||'')+'</small></td>'+
      '<td>'+phHtml(u.phone)+'</td><td>'+(u.places.map(function(x){ return esc(x.p.name)+(x.role==='owner'?'':' <span class="pill d">'+t('manager')+'</span>'); }).join('<br>')||'—')+'</td>'+
      '<td class="mono">'+(u.devs.map(function(d){ return esc(d.id); }).join(', ')||'—')+'</td><td>'+fmtD(u.created)+'</td></tr>';
  }).join('')||'<tr><td colspan="5" class="empty">'+t('none')+'</td></tr>';
}
function renderDevices(){
  var f=(q('s-dv').value||'').trim().toUpperCase();
  var L=DB.devices.filter(function(d){ var p=d.place&&P[d.place]; return !f||(d.id+' '+(p?p.name:'')+' '+(d.note||'')).toUpperCase().indexOf(f)>=0; });
  q('t-devices').innerHTML=L.map(function(d){
    var p=d.place&&P[d.place], o=ownerOf(p);
    return '<tr class="ck" onclick="openDev(\''+esc(d.id)+'\')"><td class="mono"><b>'+esc(d.id)+'</b></td><td>'+(p?esc(p.name)+(o?'<br><small class="d">'+esc(uName(o))+'</small>':''):(d.note?'<small class="d">'+esc(d.note)+'</small>':'—'))+'</td>'+
      '<td>'+devState(d)+'</td><td class="mono">'+esc(d.fw||'—')+'</td><td>'+fmtD(d.claimed)+'</td></tr>';
  }).join('')||'<tr><td colspan="5" class="empty">'+t('none')+'</td></tr>';
}
function renderLog(){ q('t-log').innerHTML=DB.audit.map(logRow).join('')||'<tr><td colspan="4" class="empty">'+t('none')+'</td></tr>'; }
function renderAll(){
  renderHome(); renderClients(); renderDevices(); renderLog();
  q('c-cl').textContent=DB.users.length; q('c-dv').textContent=DB.devices.length;
  if(_dr){ if(_dr.k==='d')openDev(_dr.id); else openCl(_dr.id); }
}

var _dr=null;
function kv(k,v){ return '<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>'; }
function openDev(id){
  var d=DV[id]; if(!d)return; _dr={k:'d',id:id};
  var p=d.place&&P[d.place];
  var h='<h2>📦 '+t('device')+' <span class="mono">'+esc(d.id)+'</span></h2><p class="sub" style="margin:0 0 10px">'+devState(d)+'</p>'+
    kv(t('place'),p?esc(p.name):'—')+kv(t('fw'),'<span class="mono">'+esc(d.fw||'—')+'</span>')+kv(t('sim'),phHtml(d.sim))+
    kv(t('key'),d.key?t('key_ok'):'<span style="color:var(--r)">'+t('key_no')+'</span>')+kv(t('linked_on'),fmtD(d.claimed,true))+kv(t('created'),fmtD(d.created));
  if(p){
    h+='<div class="sec">'+t('members')+'</div>'+p.mem.map(function(m){ var u=U[m.user]; return '<div class="kv ck" onclick="openCl(\''+esc(m.user)+'\')"><span>'+esc(uName(u))+'</span><b><span class="pill '+(m.role==='owner'?'g':'d')+'">'+t(m.role)+'</span></b></div>'; }).join('');
  }
  h+='<div class="sec">'+t('note')+'</div><input class="in" id="d-note" maxlength="200" value="'+esc(d.note||'')+'"><div class="row" style="margin-top:8px"><button class="btn o" onclick="saveNote(\''+esc(d.id)+'\')">'+t('save_note')+'</button></div>';
  h+='<div class="sec">'+t('actions')+'</div>'+(p?'<button class="btn r" style="width:100%" onclick="openUnlink(\''+esc(d.id)+'\')">🔓 '+t('unlink')+'</button>':'<div class="warn">'+t('free_note')+'</div>');
  var lg=DB.audit.filter(function(a){ return a.device===d.id; });
  if(lg.length)h+='<div class="sec">'+t('log')+'</div><table><tbody>'+lg.slice(0,20).map(logRow).join('')+'</tbody></table>';
  q('dr-c').innerHTML=h; q('dr').classList.add('open');
}
function openCl(id){
  var u=U[id]; if(!u)return; _dr={k:'c',id:id};
  var h='<h2>👤 '+esc(uName(u))+'</h2><p class="sub" style="margin:0 0 10px">'+t('account')+' Google'+(u.admin?' · <span class="pill b">'+t('is_admin')+'</span>':'')+'</p>'+
    kv(t('email'),'<span class="mono">'+esc(u.email||'—')+'</span>')+kv(t('phone'),phHtml(u.phone))+kv(t('created'),fmtD(u.created,true))+kv(t('last_login'),fmtD(u.last,true));
  h+='<div class="sec">'+t('places')+'</div>'+(u.places.map(function(x){
    return '<div class="kv"><span>'+esc(x.p.name)+'</span><b><span class="pill '+(x.role==='owner'?'g':'d')+'">'+t(x.role)+'</span></b></div>'+
      x.p.devs.map(function(d){ return '<div class="kv ck" onclick="openDev(\''+esc(d.id)+'\')"><span class="mono">&nbsp;&nbsp;📦 '+esc(d.id)+'</span><b>'+devState(d)+'</b></div>'; }).join('');
  }).join('')||'<div class="kv"><span>'+t('none')+'</span></div>');
  q('dr-c').innerHTML=h; q('dr').classList.add('open');
}
function closeDr(){ _dr=null; q('dr').classList.remove('open'); }
function noteBad(v){ return /[0-9a-f]{24,}/i.test(String(v||'').replace(/\s/g,'')); }
function saveNote(id){
  if(noteBad(q('d-note').value)){ toast(t('note_key')); return; }
  sb.rpc('admin_device_note',{p_device:id,p_note:q('d-note').value}).then(function(r){
    if(r.error){ toast(errText(r.error)); return; } toast(t('saved')); load();
  });
}
var _u='';
function openUnlink(id){ _u=id; q('u-id').textContent=id; q('u-c1').checked=false; q('u-r').value=''; q('u-msg').innerHTML=''; uChk(); openM('m-unlink'); }
function uChk(){ q('u-go').disabled=!(q('u-c1').checked&&q('u-r').value.trim().length>=5); }
function doUnlink(){
  q('u-go').disabled=true;
  sb.rpc('admin_device_unlink',{p_device:_u,p_reason:q('u-r').value.trim()}).then(function(r){
    if(r.error){ q('u-msg').innerHTML='<div class="err">'+esc(errText(r.error))+'</div>'; uChk(); return; }
    closeM(); toast(t('unlinked')); load();
  });
}
function openAdd(){ q('a-id').value=''; q('a-key').value=''; q('a-note').value=''; q('a-msg').innerHTML=''; openM('m-add'); setTimeout(function(){ q('a-id').focus(); },50); }
function doAdd(){
  var id=q('a-id').value.trim().toUpperCase(), key=q('a-key').value.trim().toLowerCase(), note=q('a-note').value.trim();
  if(!/^[0-9A-F]{6}$/.test(id)){ q('a-msg').innerHTML='<div class="err">'+t('bad_id')+'</div>'; return; }
  if(!/^[0-9a-f]{64}$/.test(key)){ q('a-msg').innerHTML='<div class="err">'+t('bad_key')+'</div>'; return; }
  if(noteBad(note)){ q('a-msg').innerHTML='<div class="err">'+t('note_key')+'</div>'; return; }
  if(DV[id]&&!doAdd._ok){ doAdd._ok=id; q('a-msg').innerHTML='<div class="warn">'+t('exists')+'</div>'; return; }
  doAdd._ok=null; q('a-go').disabled=true;
  sb.rpc('admin_device_register',{p_device:id,p_key_hex:key,p_note:note||null}).then(function(r){
    q('a-go').disabled=false; q('a-key').value='';
    if(r.error){ q('a-msg').innerHTML='<div class="err">'+esc(errText(r.error))+'</div>'; return; }
    closeM(); toast(t('saved')); go('devices'); load().then(function(){ openDev(id); });
  });
}
function openM(id){ document.querySelectorAll('.modal').forEach(function(m){ m.classList.remove('open'); }); q(id).classList.add('open'); }
function closeM(){ document.querySelectorAll('.modal').forEach(function(m){ m.classList.remove('open'); }); }
function go(p){
  document.querySelectorAll('.nav a[data-p],.tabs a').forEach(function(a){ a.classList.toggle('on',a.getAttribute('data-p')===p); });
  document.querySelectorAll('.page').forEach(function(s){ s.classList.toggle('on',s.id==='p-'+p); });
  closeDr(); window.scrollTo(0,0);
}
document.querySelectorAll('.nav a[data-p],.tabs a').forEach(function(a){ a.onclick=function(){ go(a.getAttribute('data-p')); }; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeM(); closeDr(); } });

applyLang();
if(!window.supabase){ showLogin(esc(t('err_net'))); }
else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,s){
    if(ev==='SIGNED_OUT'){ ME=null; return; }
    if(s&&s.user&&(!ME||ME.id!==s.user.id)){ ME=s.user; setTimeout(load,0); }
  });
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(s){ ME=s.user; load(); } else showLogin('');
  });
}
</script>
