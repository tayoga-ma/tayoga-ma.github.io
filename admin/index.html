<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TAYOGA — Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131824">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TAYOGA Admin">
<style>
:root{--bg:#0b0e14;--s1:#131824;--s2:#1a2030;--s3:#232a3c;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--tx:#eef2f8;--dim:#8b96aa;--g:#4ade80;--b:#60a5fa;--r:#f87171;--o:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
.app{display:flex;min-height:100vh}
.nav{width:230px;flex:none;background:var(--s1);border-inline-end:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:900;font-size:21px;direction:ltr;text-align:center;margin:4px 0 2px}.brand span{color:var(--g)}
.role{text-align:center;font-size:11.5px;color:var(--dim);margin-bottom:16px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;color:#cbd5e1;text-decoration:none;cursor:pointer;font-size:14.5px}
.nav a.on{background:rgba(74,222,128,.12);color:var(--g);font-weight:700}
.nav a .c{margin-inline-start:auto;font-size:11px;background:var(--s3);border-radius:999px;padding:1px 8px;color:var(--dim)}
.nav .me{margin-top:auto;padding:10px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:8px}
.lnk{background:none;border:0;color:var(--b);font:inherit;font-size:12.5px;cursor:pointer;padding:0;text-align:start}
main{flex:1;min-width:0;padding:22px 26px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
h1{margin:0;font-size:24px}
.top .sp{flex:1}
.sub{color:var(--dim);font-size:13.5px;margin:4px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px}
.kpi small{color:var(--dim);font-size:12.5px}.kpi b{display:block;font-size:28px;margin-top:4px}
.kpi.w b{color:var(--o)}.kpi.g b{color:var(--g)}
.box{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:6px 14px 10px;margin-bottom:16px;overflow-x:auto}
.box h3{margin:10px 0 6px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--dim);font-weight:600;text-align:start;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:12.5px;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:rgba(255,255,255,.03)}
.empty{color:var(--dim);padding:14px 8px}
small.d{color:var(--dim);font-size:12px}
.mono{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap;display:inline-block}
.pill.g{background:rgba(74,222,128,.14);color:var(--g)}.pill.o{background:rgba(251,146,60,.14);color:var(--o)}.pill.r{background:rgba(248,113,113,.14);color:var(--r)}.pill.d{background:var(--s3);color:var(--dim)}.pill.b{background:rgba(96,165,250,.14);color:var(--b)}
.btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.g{background:#22c55e;color:#06210f}.btn.o{background:none;border:1px solid var(--bd2);color:var(--tx)}.btn.r{background:rgba(248,113,113,.14);color:var(--r);border:1px solid rgba(248,113,113,.35)}
.search{width:320px;max-width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;padding:9px 12px;color:var(--tx);font:inherit;font-size:13.5px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar .sp{flex:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:460px;max-width:100%;background:var(--s1);border-inline-end:1px solid var(--bd2);box-shadow:0 0 40px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s,visibility .25s;padding:20px;overflow:auto;z-index:5}
[dir=ltr] .drawer{transform:translateX(-105%)}
.drawer:not(.open){visibility:hidden}
.drawer.open{transform:none!important}
.drawer h2{margin:0 40px 4px 0;font-size:19px}
[dir=rtl] .drawer h2{margin:0 0 4px 40px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.kv span{color:var(--dim)}.kv b{text-align:end;word-break:break-word}
.kv.ck{cursor:pointer}
.sec{font-size:12px;color:var(--dim);margin:18px 0 6px;font-weight:600}
.x{position:absolute;top:14px;inset-inline-end:14px;background:var(--s3);border:0;color:var(--tx);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:20px;width:460px;max-width:100%;max-height:100%;overflow:auto}
.mbox h3{margin:0 0 6px}.mbox p{color:var(--dim);font-size:13.5px;line-height:1.7;margin:0 0 10px}
.lbl{font-size:12.5px;color:var(--dim);margin:10px 0 5px}
.in{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;color:var(--tx);font:inherit;font-size:14px}
.in.mono{text-align:left}
.cb{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#cbd5e1;margin:8px 0;line-height:1.6}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ok{background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.35);color:#86efac;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.warn{background:rgba(251,146,60,.10);border:1px solid rgba(251,146,60,.35);color:#fdba74;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);color:#fca5a5;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:10px 0}
.page{display:none}.page.on{display:block}
.tabs{display:none}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lg{width:100%;max-width:380px;text-align:center;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:28px 22px}
.lg .logo{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f2937;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px}
.gbtn svg{width:20px;height:20px}
.mask{cursor:pointer;border-bottom:1px dashed var(--bd2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--bd2);border-radius:12px;padding:10px 16px;font-size:13.5px;z-index:20;display:none}
.toast.on{display:block}
.vn{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}.vn .w{stroke:var(--g)}
h2 .vn{width:24px;height:24px;vertical-align:-5px}
/* [V3.0.7] Atelier */
.ws{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.st{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}
.st:last-of-type{border-bottom:0}
.st .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--s3);color:var(--dim);display:grid;place-items:center;font-weight:800;font-size:13px}
.st.ok .n{background:#22c55e;color:#06210f}.st.run .n{background:var(--b);color:#06121f}.st.bad .n{background:var(--r);color:#250606}
.st .c{flex:1;min-width:0}.st .c b{display:block;font-size:14.5px}.st .c small{color:var(--dim);font-size:12.5px;line-height:1.6;display:block;margin-top:2px}
.st .c .r{margin-top:6px;font-size:13px}
.ser{background:#05070b;border:1px solid var(--bd);border-radius:12px;height:300px;overflow:auto;padding:10px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#9fb0c8;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all}
.ser .me{color:var(--g)}
.lab{border:2px dashed var(--bd2);border-radius:12px;padding:14px;text-align:center;direction:ltr;margin-top:8px}
.lab b{display:block;font:800 22px/1.3 ui-monospace,Menlo,monospace;letter-spacing:1px}
.lab small{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.sm{padding:4px 10px;font-size:12px}
.rad{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0;flex-wrap:wrap}
.rad input[type=file]{font-size:12px;color:var(--dim)}
.fin{display:block;width:100%;font-size:13px;color:var(--dim);margin:4px 0 10px}
@media print{body *{visibility:hidden}.lab,.lab *{visibility:visible}.lab{position:fixed;top:0;left:0;border:1px solid #000;color:#000}}
@media(max-width:900px){
  .nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}main{padding:14px 16px 90px}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:var(--s1);border-top:1px solid var(--bd);z-index:4}
  .tabs a{flex:1;text-align:center;padding:9px 4px 11px;font-size:11.5px;color:var(--dim);cursor:pointer}
  .tabs a.on{color:var(--g);font-weight:700}
  .tabs a i{display:block;font-style:normal;font-size:18px}
  .search{width:100%}
  .ws{grid-template-columns:1fr}
  .hm{display:none}
}
</style>
</head>
<body>

<div id="login" style="display:none"><div class="lg">
  <div class="logo">💧</div>
  <div class="brand">TAYOGA <span>AIT</span></div>
  <div class="role" data-t="admin_page"></div>
  <div id="lg-msg"></div>
  <button class="gbtn" id="lg-g" onclick="signIn()"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg><span data-t="google"></span></button>
  <button class="lnk" id="lg-out" style="display:none;margin-top:14px" onclick="signOut()" data-t="signout"></button>
  <div style="margin-top:18px"><button class="lnk" onclick="toggleLang()">العربية / Français</button></div>
</div></div>

<div class="app" id="app" style="display:none">
  <nav class="nav">
    <div class="brand">TAYOGA <span>AIT</span></div>
    <div class="role" data-t="admin_page"></div>
    <a class="on" data-p="home">🏠 <span data-t="home"></span></a>
    <a data-p="clients">👥 <span data-t="clients"></span> <span class="c" id="c-cl">0</span></a>
    <a data-p="devices"><svg class="vn" viewBox="0 0 24 24"><path d="M2 15.5h4.5M17.5 15.5H22M2 12.5v6M22 12.5v6"/><circle cx="12" cy="15.5" r="5"/><path d="M9.8 15.5h4.4"/><path class="w" d="M8.6 6.6a5 5 0 0 1 6.8 0M10.3 8.7a2.4 2.4 0 0 1 3.4 0"/></svg> <span data-t="devices"></span> <span class="c" id="c-dv">0</span></a>
    <a data-p="log">🧾 <span data-t="log"></span></a>
    <a data-p="atelier">🛠 <span data-t="atelier"></span></a>
    <a data-p="ota">📦 <span data-t="ota"></span></a>
    <div class="me"><div><span data-t="admin"></span><br><span class="mono" id="me-mail"></span></div>
      <button class="lnk" onclick="toggleLang()">العربية / Français</button>
      <button class="lnk" onclick="signOut()" data-t="signout"></button></div>
  </nav>
  <main>
    <section class="page on" id="p-home">
      <div class="top"><h1 data-t="home"></h1><span class="sp"></span><button class="btn o" onclick="load()">↻ <span class="hm" data-t="refresh"></span></button></div>
      <p class="sub" id="home-sub"></p>
      <div class="kpis">
        <div class="kpi"><small data-t="k_accounts"></small><b id="k1">0</b></div>
        <div class="kpi"><small data-t="k_places"></small><b id="k2">0</b></div>
        <div class="kpi g"><small data-t="k_linked"></small><b id="k3" dir="ltr" style="text-align:start">0</b></div>
        <div class="kpi w"><small data-t="k_free"></small><b id="k4">0</b></div>
      </div>
      <div class="box" id="b-attn"><h3>⚠️ <span data-t="attention"></span></h3><table><tbody id="t-attn"></tbody></table></div>
      <div class="box"><h3>🆕 <span data-t="recent"></span></h3>
        <table><thead><tr><th data-t="date"></th><th data-t="action"></th><th data-t="device"></th><th data-t="details"></th></tr></thead><tbody id="t-new"></tbody></table></div>
    </section>

    <section class="page" id="p-clients">
      <div class="top"><h1 data-t="clients"></h1></div><p class="sub" data-t="clients_sub"></p>
      <div class="bar"><input class="search" id="s-cl" oninput="renderClients()"></div>
      <div class="box"><table><thead><tr><th data-t="client"></th><th data-t="phone"></th><th data-t="places"></th><th data-t="devices"></th><th data-t="since"></th></tr></thead><tbody id="t-clients"></tbody></table></div>
    </section>

    <section class="page" id="p-devices">
      <div class="top"><h1 data-t="devices"></h1></div><p class="sub" data-t="devices_sub"></p>
      <div class="bar"><input class="search" id="s-dv" oninput="renderDevices()"><span class="sp"></span><button class="btn g" onclick="openAdd()">＋ <span data-t="add_device"></span></button></div>
      <div class="box"><table><thead><tr><th>ID</th><th data-t="place_client"></th><th data-t="state"></th><th data-t="fw"></th><th data-t="linked_on"></th></tr></thead><tbody id="t-devices"></tbody></table></div>
    </section>

    <section class="page" id="p-log">
      <div class="top"><h1 data-t="log"></h1></div><p class="sub" data-t="log_sub"></p>
      <div class="box"><table><thead><tr><th data-t="date"></th><th data-t="action"></th><th data-t="device"></th><th data-t="details"></th></tr></thead><tbody id="t-log"></tbody></table></div>
    </section>
    <section class="page" id="p-atelier">
      <div class="top"><h1 data-t="atelier"></h1></div><p class="sub" data-t="atelier_sub"></p>
      <div class="ws">
        <div>
          <div class="box" id="ws-steps"></div>
          <div class="box"><h3>🌐 <span data-t="srv_t"></span></h3>
            <p class="sub" style="margin:0 0 6px" data-t="srv_p"></p>
            <div class="lbl" data-t="srv_host"></div><input class="in mono" id="m-host" placeholder="xxxxxx.ala.eu-central-1.emqxsl.com" autocomplete="off" spellcheck="false">
            <div class="grid2"><div><div class="lbl" data-t="srv_port"></div><input class="in mono" id="m-port" value="8084" inputmode="numeric"></div>
              <div><div class="lbl" data-t="srv_user"></div><input class="in mono" id="m-user" value="TAYOGA-APP" autocomplete="off"></div></div>
            <div class="lbl" data-t="srv_pass"></div><input class="in mono" id="m-pass" type="password" autocomplete="new-password">
            <div id="m-msg"></div>
            <div class="row"><button class="btn g" onclick="mqttSave()" data-t="save"></button></div>
          </div>
        </div>
        <div>
          <div class="box"><h3>⌨️ <span data-t="ser_t"></span> <small class="d" id="ser-st"></small></h3><div class="ser" id="ser"></div>
            <div class="row" style="justify-content:flex-start"><input class="in mono" id="ser-in" style="flex:1" placeholder="STATUS" onkeydown="if(event.key==='Enter'){wsManual();}"><button class="btn o" onclick="wsManual()" data-t="send"></button></div></div>
        </div>
      </div>
    </section>
    <section class="page" id="p-ota">
      <div class="top"><h1>📦 <span data-t="ota"></span></h1></div><p class="sub" data-t="ota_sub"></p>
      <div class="ws">
        <div>
          <div class="box"><h3>🚀 <span data-t="ota_new"></span></h3>
            <div class="lbl" data-t="ota_bin"></div><input class="fin" type="file" id="ota-bin" accept=".bin" onchange="otaPick()">
            <div class="lbl" data-t="ota_mergedf"></div><input class="fin" type="file" id="ota-merged" accept=".bin" onchange="otaPick()">
            <div class="lbl" data-t="ota_keyf"></div><input class="fin" type="file" id="ota-key" accept=".private,.json" onchange="otaPick()">
            <div class="lbl" data-t="ota_notes"></div><input class="in" id="ota-notes" maxlength="200">
            <div id="ota-chk" class="chk" style="font-size:13px;line-height:1.9"></div>
            <div id="ota-msg"></div>
            <div class="row"><button class="btn g" id="ota-go" onclick="otaPublish()" disabled></button></div>
          </div>
          <div class="box"><h3>🔐 <span data-t="ota_key_t"></span></h3><p class="sub" style="margin:0 0 6px" data-t="ota_key_p"></p><div id="ota-pub"></div></div>
        </div>
        <div>
          <div class="box"><h3>📡 <span data-t="ota_cur_t"></span></h3><div id="ota-cur"></div></div>
          <div class="box"><h3>🗂 <span data-t="ota_hist"></span></h3><table><thead><tr><th data-t="ota_ver"></th><th data-t="date"></th><th></th></tr></thead><tbody id="ota-hist"></tbody></table></div>
        </div>
      </div>
    </section>
  </main>
  <div class="tabs">
    <a class="on" data-p="home"><i>🏠</i><span data-t="home"></span></a>
    <a data-p="clients"><i>👥</i><span data-t="clients"></span></a>
    <a data-p="devices"><i><svg class="vn" viewBox="0 0 24 24"><path d="M2 15.5h4.5M17.5 15.5H22M2 12.5v6M22 12.5v6"/><circle cx="12" cy="15.5" r="5"/><path d="M9.8 15.5h4.4"/><path class="w" d="M8.6 6.6a5 5 0 0 1 6.8 0M10.3 8.7a2.4 2.4 0 0 1 3.4 0"/></svg></i><span data-t="devices"></span></a>
    <a data-p="log"><i>🧾</i><span data-t="log"></span></a>
    <a data-p="atelier"><i>🛠</i><span data-t="atelier"></span></a>
    <a data-p="ota"><i>📦</i><span data-t="ota"></span></a>
  </div>
</div>

<div class="drawer" id="dr"><button class="x" onclick="closeDr()">✕</button><div id="dr-c"></div></div>

<div class="modal" id="m-unlink"><div class="mbox">
  <h3>🔓 <span data-t="unlink_t"></span> <span class="mono" id="u-id"></span></h3>
  <p data-t="unlink_p"></p>
  <div class="cb"><input type="checkbox" id="u-c1" onchange="uChk()"><label for="u-c1" data-t="unlink_ck"></label></div>
  <div class="lbl" data-t="reason"></div>
  <input class="in" id="u-r" maxlength="200" oninput="uChk()">
  <div id="u-msg"></div>

function q(id){ return document.getElementById(id); }

function fmtD(s,withTime){

/* ══ [V3.0.7] Atelier : boîtier neuf par USB (Web Serial) ══
   Les clés naissent DANS le boîtier (KEYGEN) ; elles passent ici une fois,
   vont au serveur, puis sont effacées de la page. Le mot de passe du compte
   TAYOGA-BOX reste en mémoire le temps de la session, jamais enregistré.
   [V3.0.8] + le flash depuis Chrome (esptool-js) et la clé publique des mises à jour. */
var WS={port:null,writer:null,reader:null,buf:'',lines:[],waiters:[],busy:false,id:'',K:'',R:'',st:{},r:{},boxPass:'',flashing:false};
function wsMask(l){ return String(l).replace(/(K|R)=[0-9A-F]{64}/g,'$1=••••••••').replace(/(SETMQTTPASS:).*/i,'$1***'); }
function wsLog(l,me){
  var e=q('ser'); if(!e)return;
  var d=document.createElement('div'); if(me)d.className='me'; d.textContent=wsMask(l); e.appendChild(d);
  while(e.childNodes.length>400)e.removeChild(e.firstChild);
  e.scrollTop=e.scrollHeight;
}
function wsLine(l){
  WS.lines.push(l); if(WS.lines.length>2000)WS.lines.splice(0,500);
  wsLog(l);
  WS.waiters.slice().forEach(function(w){ var m=w.re.exec(l); if(m){ WS.waiters.splice(WS.waiters.indexOf(w),1); clearTimeout(w.to); w.res(m); } });
}
function wsWait(re,ms){ return new Promise(function(res){ var w={re:re,res:res}; w.to=setTimeout(function(){ var i=WS.waiters.indexOf(w); if(i>=0)WS.waiters.splice(i,1); res(null); },ms); WS.waiters.push(w); }); }
function wsSend(cmd){ wsLog('> '+cmd,true); return WS.writer.write(new TextEncoder().encode(cmd+'\n')); }
function wsBlock(cmd,ms){
  var start=WS.lines.length, p=wsWait(/\[USB\] --- fin ---/,ms||8000);
  return wsSend(cmd).then(function(){ return p; }).then(function(m){ return m?WS.lines.slice(start).join('\n'):null; });
}
function wsSleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
async function wsOpen(reuse){
  if(WS.port&&WS.writer)return true;
  if(!('serial' in navigator))throw new Error(t('ws_noserial'));
  var port=reuse||WS.lastPort||await navigator.serial.requestPort();
  await port.open({baudRate:115200});
  try{ await port.setSignals({dataTerminalReady:false,requestToSend:false}); }catch(e){}
  WS.port=port; WS.lastPort=port; WS.writer=port.writable.getWriter();
  var dec=new TextDecoderStream(); WS.pipe=port.readable.pipeTo(dec.writable).catch(function(){});
  WS.reader=dec.readable.getReader();
  (async function(){
    try{ for(;;){ var x=await WS.reader.read(); if(x.done)break; WS.buf+=x.value; var i;
      while((i=WS.buf.indexOf('\n'))>=0){ var l=WS.buf.slice(0,i).replace(/\r$/,''); WS.buf=WS.buf.slice(i+1); wsLine(l); } } }catch(e){}
  })();
  q('ser-st').textContent='● 115200';
  port.addEventListener&&port.addEventListener('disconnect',function(){ WS.port=null; WS.writer=null; WS.lastPort=null; wsRender(); });
  await wsSleep(2500);
  return true;
}
/* Libérer le port (pour le flash) */
async function wsClose(){
  if(!WS.port)return;
  try{ await WS.reader.cancel(); }catch(e){}
  try{ await WS.pipe; }catch(e){}
  try{ WS.writer.releaseLock(); }catch(e){}
  try{ await WS.port.close(); }catch(e){}
  WS.port=null; WS.writer=null; WS.reader=null; q('ser-st').textContent='';
}
function wsSet(k,st,r){ WS.st[k]=st; if(r!==undefined)WS.r[k]=r; wsRender(); }
function otaManifestUrl(){ return SUPABASE_URL+'/storage/v1/object/public/firmware/manifest.json'; }
var WS_STEPS=['usb','id','keys','ota','reg','box','test','lab'];
async function wsStep(k){
  if(k==='usb'){ await wsOpen(); wsSet(k,'ok','✓'); return; }
  if(k==='id'){
    // le boîtier redémarre souvent à l'ouverture du port : son démarrage peut prendre 20 s
    var x=await wsBlock('ID',30000); var m=x&&/ID: ([0-9A-F]{6})/.exec(x);
    if(!m)throw new Error(t('ws_timeout'));
    WS.id=m[1];
    var fw=/Usine:/.test(x)?'':' · ⚠️ Firmware ≥ V3.0.8 ?';
    if(DV[WS.id]&&DV[WS.id].place)throw new Error(WS.id+' — '+t('ws_owned'));
    wsSet(k,'ok','<b class="mono">'+esc(WS.id)+'</b>'+fw); return;
  }
  if(k==='keys'){
    var x=await wsBlock('KEYGEN');
    if(x&&/KEYGEN:EXISTE/.test(x)){
      if(!confirm(t('ws_force')))throw new Error('—');
      x=await wsBlock('KEYGEN:FORCE');
    }
    var m=x&&/KEYGEN:OK ID=([0-9A-F]{6}) K=([0-9A-F]{64}) R=([0-9A-F]{64})/.exec(x);
    if(!m)throw new Error(x?'KEYGEN ? (Firmware ≥ V3.0.8)':t('ws_timeout'));
    if(m[1]!==WS.id)throw new Error('ID ≠ '+WS.id);
    WS.K=m[2]; WS.R=m[3];
    wsSet(k,'ok','🔑 ✓'); return;
  }
  if(k==='ota'){
    if(!OTA.pub)throw new Error(t('ws_nopub'));
    var x=await wsBlock('SETOTAURL:'+otaManifestUrl());
    if(x===null)throw new Error(t('ws_timeout'));
    x=await wsBlock('SETOTAPUB:'+OTA.pub);
    if(!x||!/SETOTAPUB:OK/.test(x))throw new Error(x?'SETOTAPUB ? (Firmware ≥ V3.0.8)':t('ws_timeout'));
    wsSet(k,'ok','📦 ✓'); return;
  }
  if(k==='reg'){
    if(!WS.K||!WS.R)throw new Error('KEYGEN');
    var r=await sb.rpc('admin_device_register2',{p_device:WS.id,p_key_hex:WS.K,p_rec_hex:WS.R,p_note:null});
    if(r.error){ var em=r.error.message==='owned'?t('ws_owned'):errText(r.error); throw new Error(em); }
    WS.K=''; WS.R='';
    await load();
    wsSet(k,'ok','<span class="pill o">'+t('st_free')+'</span>'); return;
  }
  if(k==='box'){
    var host=(MQ.host||'').trim(); if(!host)throw new Error(t('ws_nohost'));
    var user=(q('ws-user')||{}).value||'TAYOGA-BOX', port=parseInt((q('ws-port')||{}).value||'8883',10), pw=(q('ws-pass')||{}).value||WS.boxPass;
    if(!pw)throw new Error(t('ws_box_pass')+' ?');
    WS.boxPass=pw;
    var cmds=['SETMQTTHOST:'+host,'SETMQTTPORT:'+port,'SETMQTTUSER:'+user.trim(),'SETMQTTPASS:'+pw];
    if(port===8883)cmds.push('MQTT:TLS:ON');
    cmds.push('MQTT:ON');
    for(var i=0;i<cmds.length;i++){ var x=await wsBlock(cmds[i],12000); if(x===null)throw new Error(t('ws_timeout')+' ('+cmds[i].split(':')[0]+')'); }
    wsSet(k,'ok','<span class="mono">'+esc(user)+' @ '+esc(host)+':'+port+'</span>'); return;
  }
  if(k==='test'){
    for(var n=0;n<12;n++){
      var x=await wsBlock('MQTT:STATUS',8000);
      if(x&&/Connecte OK/.test(x)){ wsSet(k,'ok','✓ Connecte OK'); return; }
      wsSet(k,'run','… '+(n+1)+'/12'); await wsSleep(5000);
    }
    throw new Error(t('ws_mqtt_ko'));
  }
  if(k==='lab'){ wsSet(k,'ok',''); return; }
}
async function wsRun(from){
  if(WS.busy||WS.flashing)return; WS.busy=true;
  try{
    for(var i=WS_STEPS.indexOf(from||'usb');i<WS_STEPS.length;i++){
      var k=WS_STEPS[i];
      wsSet(k,'run','…');
      try{ await wsStep(k); }
      catch(e){ wsSet(k,'bad',esc(e&&e.message||String(e))); return; }
    }
  } finally { WS.busy=false; wsRender(); }
}
function wsSkip(k){ wsSet(k,'ok','—'); var i=WS_STEPS.indexOf(k); if(i<WS_STEPS.length-1)wsRun(WS_STEPS[i+1]); }
function wsNext(){ WS.id=''; WS.K=''; WS.R=''; WS.st={}; WS.r={}; wsRender(); }
function wsManual(){
  var v=q('ser-in').value.trim(); if(!v||!WS.writer)return;
  if(/^KEYGEN/i.test(v)){ toast('KEYGEN → '+t('ws_go')); return; }   // les clés passent seulement par les étapes
  wsSend(v); q('ser-in').value='';
}

/* ── [V3.0.8] Flash depuis Chrome (esptool-js, fichier .merged.bin à l'adresse 0) ── */
function binStr(u8){ var s='', C=0x8000; for(var i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C)); return s; }
async function wsFlash(){
  if(WS.busy||WS.flashing)return;
  if(!('serial' in navigator)){ toast(t('ws_noserial')); return; }
  var src=(document.querySelector('input[name=fl-src]:checked')||{}).value||'pub', erase=q('fl-erase').checked, data=null, label='';
  try{
    WS.flashing=true; wsFlashSay('…'); wsRender();
    if(src==='file'){
      var f=q('fl-file').files[0]; if(!f)throw new Error(t('fl_pick'));
      data=new Uint8Array(await f.arrayBuffer()); label=f.name;
    } else {
      var cur=(OTA.rel||[]).filter(function(r){ return r.current&&r.merged; })[0];
      if(!cur)throw new Error(t('fl_nopub'));
      var dir=cur.version.replace(/\./g,'_');
      wsFlashSay(t('fl_dl')+' '+cur.version+'…');
      var rr=await fetch(SUPABASE_URL+'/storage/v1/object/public/firmware/'+dir+'/merged.bin',{cache:'no-store'});
      if(!rr.ok)throw new Error('HTTP '+rr.status);
      data=new Uint8Array(await rr.arrayBuffer()); label=cur.version;
    }
    if(data.length<150000||data[0]!==0xE9)throw new Error(t('fl_bad'));
    await wsClose();
    var mod=await import('./esptool-0.5.4.js');
    var port=WS.lastPort||await navigator.serial.requestPort(); WS.lastPort=port;
    var tr=new mod.Transport(port,false);
    var ld=new mod.ESPLoader({transport:tr,baudrate:460800,romBaudrate:115200,
      terminal:{clean:function(){},writeLine:function(l){ wsLog(l); },write:function(d){}}});
    wsFlashSay(t('fl_conn'));
    var chip=await ld.main();
    if(!/ESP32(?!-[CHS])/.test(String(chip)))throw new Error(t('fl_chip')+' '+chip);
    await ld.writeFlash({fileArray:[{data:binStr(data),address:0}],flashSize:'keep',flashMode:'keep',flashFreq:'keep',
      eraseAll:erase,compress:true,reportProgress:function(i,w,tt){ wsFlashSay(t('fl_write')+' '+Math.round(w*100/tt)+'%'); }});
    try{ await ld.after('hard_reset'); }catch(e){}
    try{ await tr.disconnect(); }catch(e){}
    wsFlashSay('✓ '+label+' — '+t('fl_ok'),true);
    WS.st={}; WS.r={};
    WS.flashing=false; wsRender();
    await wsSleep(1500);
    wsRun('usb');
  }catch(e){
    wsFlashSay('⛔ '+esc(e&&e.message||String(e)),false,true);
  } finally { WS.flashing=false; wsRender(); }
}
function wsFlashSay(m,ok,bad){ var e=q('fl-msg'); if(e)e.innerHTML='<div class="'+(bad?'err':ok?'ok':'warn')+'">'+m+'</div>'; WS.flashMsg=e?e.innerHTML:''; }

function wsRender(){
  var e=q('ws-steps'); if(!e)return;
  var S={usb:['ws1','ws1s'],id:['ws2','ws2s'],keys:['ws3','ws3s'],ota:['ws_ota','ws_otas'],reg:['ws4','ws4s'],box:['ws5','ws5s'],test:['ws6','ws6s'],lab:['ws7','ws7s']};
  var cur=(OTA.rel||[]).filter(function(r){ return r.current&&r.merged; })[0];
  var h='<h3>⚡ '+t('fl_t')+'</h3>';
  if(!('serial' in navigator))h+='<div class="err">'+t('ws_noserial')+'</div>';
  h+='<p class="sub" style="margin:0 0 8px">'+t('fl_p')+'</p>'+
    '<label class="rad"><input type="radio" name="fl-src" value="pub" '+(cur?'checked':'disabled')+'> '+t('fl_src_pub')+' <b class="mono">'+(cur?esc(cur.version):'—')+'</b></label>'+
    '<label class="rad"><input type="radio" name="fl-src" value="file" '+(cur?'':'checked')+'> '+t('fl_src_file')+' <input type="file" id="fl-file" accept=".bin"></label>'+
    '<label class="rad"><input type="checkbox" id="fl-erase" checked> '+t('fl_erase')+'</label>'+
    '<div id="fl-msg">'+(WS.flashMsg||'')+'</div>'+
    '<div class="row" style="justify-content:flex-start"><button class="btn o" '+(WS.flashing||WS.busy?'disabled':'')+' onclick="wsFlash()">⚡ '+t('fl_go')+'</button></div>'+
    '<h3 style="margin-top:16px">🛠 '+t('atelier')+'</h3>';
  h+=WS_STEPS.map(function(k,ix){
    var st=WS.st[k]||'', r=WS.r[k]||'', x='';
    if(k==='box')x='<div class="grid2" style="margin-top:6px"><div><div class="lbl">'+t('ws_box_user')+'</div><input class="in mono" id="ws-user" value="TAYOGA-BOX"></div>'+
      '<div><div class="lbl">'+t('ws_port_dev')+'</div><input class="in mono" id="ws-port" value="8883" inputmode="numeric"></div></div>'+
      '<div class="lbl">'+t('ws_box_pass')+'</div><input class="in mono" id="ws-pass" type="password" autocomplete="new-password" placeholder="'+(WS.boxPass?'••••••••':'')+'">';
    if(k==='lab'&&WS.id)x='<div class="lab" id="ws-lab"><b>TAYOGA-'+esc(WS.id)+'</b><small>ID '+esc(WS.id)+' · Wi-Fi TAYOGA-'+esc(WS.id)+'</small></div>'+
      '<div class="row" style="justify-content:flex-start"><button class="btn o" onclick="window.print()">🖨 '+t('ws_print')+'</button></div>';
    var skip=(k==='test'||k==='ota')?'<button class="btn o" onclick="wsSkip(\''+k+'\')">'+t('ws_skip')+'</button>':'';
    return '<div class="st '+st+'"><div class="n">'+(st==='ok'?'✓':(ix+1))+'</div><div class="c"><b>'+t(S[k][0])+'</b><small>'+t(S[k][1])+'</small>'+
      (r?'<div class="r">'+r+'</div>':'')+x+
      (st==='bad'?'<div class="row" style="justify-content:flex-start"><button class="btn o" onclick="wsRun(\''+k+'\')">↻ '+t('ws_retry')+'</button>'+skip+'</div>':'')+
      '</div></div>';
  }).join('');
  h+='<div class="row">'+(WS.st.lab==='ok'?'<button class="btn g" onclick="wsNext()">➜ '+t('ws_next')+'</button>':'<button class="btn g" '+(WS.busy||WS.flashing?'disabled':'')+' onclick="wsRun(WS.port?\'id\':\'usb\')">▶ '+t('ws_go')+'</button>')+'</div>';
  var keep=q('ws-pass')&&q('ws-pass').value, fl=q('fl-file')&&q('fl-file').files[0], er=q('fl-erase')?q('fl-erase').checked:true;
  e.innerHTML=h;
  if(keep&&q('ws-pass'))q('ws-pass').value=keep;
  if(q('fl-erase'))q('fl-erase').checked=er;
  if(fl&&q('fl-file')){ try{ var dt=new DataTransfer(); dt.items.add(fl); q('fl-file').files=dt.files; }catch(x){} }
}

/* ══ [V3.0.8] Mises à jour : signature ECDSA P-256 dans le navigateur ══
   La clé PRIVÉE est un fichier sur la clé USB de l'administrateur : elle est
   lue ici le temps de signer, jamais envoyée. Seule la clé PUBLIQUE est au
   serveur ; l'atelier la donne aux boîtiers (SETOTAPUB, USB seulement). */
var OTA={pub:null,rel:[],fw:{}}, OF={bin:null,merged:null,key:null,ver:'',size:0,sha:''};
function otaLoad(){
  sb.rpc('admin_ota_get').then(function(r){
    if(r.error)return;
    var d=r.data||{}; OTA={pub:d.pub,rel:d.releases||[],fw:d.fw||{}};
    otaRender(); wsRender();
  });
}
function hx(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
function unhx(h){ var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16); return a; }
function verDir(v){ return v.replace(/\./g,'_'); }
function fwPub(path){ return SUPABASE_URL+'/storage/v1/object/public/firmware/'+path; }
async function otaKeyGen(){
  if(OTA.pub&&!confirm(t('ota_replace')))return;
  var kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  var jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
  var pub=hx(await crypto.subtle.exportKey('raw',kp.publicKey)).toUpperCase();
  var blob=new Blob([JSON.stringify({tayoga:'ota-private-key',created:new Date().toISOString(),pub:pub,jwk:jwk},null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tayoga_update.private'; document.body.appendChild(a); a.click(); a.remove();
  var r=await sb.rpc('admin_ota_pub_set',{p_pub:pub,p_force:!!OTA.pub});
  if(r.error){ toast(errText(r.error)); return; }
  toast(t('ota_key_ok')); otaLoad();
}
async function otaPick(){
  OF={bin:q('ota-bin').files[0]||null,merged:q('ota-merged').files[0]||null,key:null,ver:'',size:0,sha:'',err:''};
  var kf=q('ota-key').files[0];
  try{
    if(OF.bin){
      var m=/V?(\d+)[._](\d+)[._](\d+)/i.exec(OF.bin.name);
      OF.ver=m?('V'+m[1]+'.'+m[2]+'.'+m[3]):'';
      if(/merged/i.test(OF.bin.name))OF.err=t('ota_err_merged');
      var buf=await OF.bin.arrayBuffer(); OF.size=buf.byteLength;
      OF.sha=hx(await crypto.subtle.digest('SHA-256',buf));
      if(new Uint8Array(buf)[0]!==0xE9)OF.err=t('fl_bad');
    }
    if(OF.merged&&!/merged/i.test(OF.merged.name))OF.err=t('ota_err_notmerged');
    if(kf){
      var k=JSON.parse(await kf.text());
      if(!k||k.tayoga!=='ota-private-key'||!k.jwk)throw new Error(t('ota_err_key'));
      OF.key=k;
      if(String(k.pub).toUpperCase()!==String(OTA.pub||'').toUpperCase())OF.err=t('ota_err_pub');
    }
  }catch(e){ OF.err=e.message||String(e); }
  otaRender();
}
function verNum(v){ var m=/V(\d+)\.(\d+)\.(\d+)/.exec(v||''); return m?(+m[1])*1e6+(+m[2])*1e3+(+m[3]):0; }
async function otaPublish(){
  var b=q('ota-go'); if(b)b.disabled=true;
  try{
    if(!OF.bin||!OF.key||!OF.ver||OF.err)throw new Error(OF.err||t('ota_err_missing'));
    var msg=OF.ver+'|'+OF.size+'|'+OF.sha;
    var key=await crypto.subtle.importKey('jwk',OF.key.jwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    var sig=hx(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,new TextEncoder().encode(msg))).toUpperCase();
    var pk=await crypto.subtle.importKey('raw',unhx(OTA.pub),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pk,unhx(sig),new TextEncoder().encode(msg)))throw new Error(t('ota_err_pub'));
    var dir=verDir(OF.ver), st=sb.storage.from('firmware'), notes=(q('ota-notes').value||'').trim().slice(0,200);
    otaSay(t('ota_up')+' app.bin…');
    var u=await st.upload(dir+'/app.bin',OF.bin,{upsert:true,contentType:'application/octet-stream',cacheControl:'31536000'});
    if(u.error)throw u.error;
    if(OF.merged){ otaSay(t('ota_up')+' merged.bin…');
      u=await st.upload(dir+'/merged.bin',OF.merged,{upsert:true,contentType:'application/octet-stream',cacheControl:'31536000'}); if(u.error)throw u.error; }
    var man={version:OF.ver,size:OF.size,sha256:OF.sha,sig:sig,url:fwPub(dir+'/app.bin')};
    if(notes)man.notes=notes;
    var mb=new Blob([JSON.stringify(man)],{type:'application/json'});
    u=await st.upload(dir+'/manifest.json',mb,{upsert:true,contentType:'application/json',cacheControl:'31536000'}); if(u.error)throw u.error;
    u=await st.upload('manifest.json',mb,{upsert:true,contentType:'application/json',cacheControl:'30'}); if(u.error)throw u.error;
    var r=await sb.rpc('admin_ota_publish',{p_version:OF.ver,p_size:OF.size,p_sha:OF.sha,p_notes:notes||null,p_merged:!!OF.merged});
    if(r.error)throw r.error;
    OF={bin:null,merged:null,key:null,ver:'',size:0,sha:''};
    ['ota-bin','ota-merged','ota-key','ota-notes'].forEach(function(i){ q(i).value=''; });
    toast('✓ '+man.version+' — '+t('ota_pub_ok')); otaSay(''); otaLoad();
  }catch(e){ otaSay('⛔ '+esc(errText(e)),true); }
  finally{ if(b)b.disabled=false; }
}
async function otaBack(v){
  if(!confirm(t('ota_back_q').replace('%',v)))return;
  try{
    var st=sb.storage.from('firmware'), d=await st.download(verDir(v)+'/manifest.json');
    if(d.error)throw d.error;
    var u=await st.upload('manifest.json',d.data,{upsert:true,contentType:'application/json',cacheControl:'30'}); if(u.error)throw u.error;
    var r=await sb.rpc('admin_ota_current',{p_version:v}); if(r.error)throw r.error;
    toast('✓ '+v); otaLoad();
  }catch(e){ toast(errText(e)); }
}
function otaSay(m,bad){ var e=q('ota-msg'); if(e)e.innerHTML=m?'<div class="'+(bad?'err':'warn')+'">'+m+'</div>':''; }
function otaRender(){
  var e=q('ota-pub'); if(!e)return;
  e.innerHTML=OTA.pub
    ?'<div class="ok">'+t('ota_pub_has')+' <span class="mono">'+esc(OTA.pub.slice(0,6)+'…'+OTA.pub.slice(-4))+'</span></div><div class="row" style="justify-content:flex-start"><button class="btn o" onclick="otaKeyGen()">'+t('ota_regen')+'</button></div>'
    :'<div class="warn">'+t('ota_nokey')+'</div><div class="row" style="justify-content:flex-start"><button class="btn g" onclick="otaKeyGen()">🔐 '+t('ota_gen')+'</button></div>';
  var cur=(OTA.rel||[]).filter(function(r){ return r.current; })[0];
  var tot=0, upd=0; Object.keys(OTA.fw||{}).forEach(function(v){ tot+=OTA.fw[v]; if(cur&&v===cur.version)upd+=OTA.fw[v]; });
  q('ota-cur').innerHTML=cur
    ?kv(t('ota_ver'),'<b class="mono">'+esc(cur.version)+'</b>')+kv(t('ota_at'),fmtD(cur.at,true))+kv(t('ota_size'),'<bdi dir=ltr>'+(cur.size/1048576).toFixed(2)+' MB</bdi>')+
     kv(t('ota_upd'),'<bdi dir=ltr>'+upd+' / '+tot+'</bdi>')+(cur.notes?kv(t('ota_notes'),esc(cur.notes)):'')+kv(t('ota_merged'),cur.merged?'✓':'—')
    :'<p class="d">'+t('ota_none')+'</p>';
  q('ota-hist').innerHTML=(OTA.rel||[]).map(function(r){
    return '<tr><td class="mono">'+esc(r.version)+'</td><td>'+fmtD(r.at)+'</td><td>'+(r.current?'<span class="pill g">'+t('ota_cur')+'</span>':'<button class="btn o sm" onclick="otaBack(\''+esc(r.version)+'\')">↩ '+t('ota_back')+'</button>')+'</td></tr>';
  }).join('')||'<tr><td colspan="3" class="d">—</td></tr>';
  var c=[];
  if(OF.bin)c.push((OF.ver?'✓ '+esc(OF.bin.name)+' · '+OF.size.toLocaleString()+' octets · '+esc(OF.ver):'⛔ '+t('ota_err_ver')));
  if(OF.sha)c.push('✓ SHA-256 '+OF.sha.slice(0,12)+'…');
  if(OF.merged)c.push('✓ '+esc(OF.merged.name));
  if(OF.key&&!OF.err)c.push('✓ '+t('ota_key_match'));
  if(OF.ver&&cur&&verNum(OF.ver)<=verNum(cur.version))c.push('⚠️ '+t('ota_older')+' ('+esc(cur.version)+')');
  if(OF.err)c.push('⛔ '+esc(OF.err));
  q('ota-chk').innerHTML=c.join('<br>');
  var go=q('ota-go'); if(go){ go.disabled=!(OF.bin&&OF.key&&OF.ver&&!OF.err&&OTA.pub); go.textContent='🚀 '+t('ota_publish')+(OF.ver?' '+OF.ver:''); }
}

applyLang();
if(!window.supabase){ showLogin(esc(t('err_net'))); }
else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,s){
    if(ev==='SIGNED_OUT'){ ME=null; return; }
    if(s&&s.user&&(!ME||ME.id!==s.user.id)){ ME=s.user; setTimeout(load,0); }
  });
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(s){ ME=s.user; load(); } else showLogin('');
  });
}
